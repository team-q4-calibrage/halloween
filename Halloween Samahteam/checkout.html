<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finaliser ma Commande | HalloweenStore</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🕸️ HalloweenStore</a>
    <a href="index.html" style="color: var(--text-light); text-decoration: none;">← Retour boutique</a>
  </nav>

  <!-- Formulaire Netlify invisible sans serveur -->
  <form name="commande-halloween" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="nom" />
    <input type="tel" name="telephone" />
    <input type="text" name="adresse" />
  </form>

  <main class="checkout-container">
    <h2>Votre Panier</h2>
    
    <div id="checkout-cart-items">
      <!-- Rempli par app.js -->
    </div>

    <div class="checkout-summary">
      <h3>Total : <span id="cart-total">0.00 €</span></h3>
      <p class="badge-trust">💳 Paiement à la livraison / Mobile Money - Démo sécurisée</p>
    </div>

    <form id="order-form" action="confirmation.html" method="POST" data-netlify="true" name="commande-halloween">
      <h3>Coordonnées de Livraison</h3>
      
      <label for="nom">Nom complet :</label>
      <input type="text" id="nom" name="nom" required placeholder="Ex: Jean Dupont">

      <label for="telephone">Téléphone :</label>
      <input type="tel" id="telephone" name="telephone" required placeholder="Ex: +229 90 00 00 00">

      <label for="adresse">Adresse de livraison :</label>
      <input type="text" id="adresse" name="adresse" required placeholder="Ex: Cotonou, Quartier X">

      <button type="submit" class="btn-cta" style="margin-top: 15px;">🎃 Valider la commande</button>
      <button type="button" id="whatsapp-btn" class="btn-whatsapp">📲 Commander via WhatsApp</button>
    </form>
  </main>

  <footer>
    <p>© 2026 HalloweenStore - Tous droits réservés</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
